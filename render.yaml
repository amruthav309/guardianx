services:
  - type: web
    name: guardianx
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: guardianx-db
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: OTP_EXPIRY
        value: "300"
      - key: APP_NAME
        value: GuardianX
      - key: APP_VERSION
        value: "1.0"

databases:
  - name: guardianx-db
    databaseName: guardianx
    user: guardianx_user
    plan: free
